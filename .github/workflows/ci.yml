name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Run the tests
        run: python -m pytest --junitxml=junit.xml
        continue-on-error: true
      - name: Trace requirements to test results
        uses: RachidChabane/shallnot@v0.4.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shallnot-report-${{ matrix.os }}
          path: shallnot-report.json
          if-no-files-found: ignore
